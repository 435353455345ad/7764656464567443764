
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodnotes</title>

    <p>.</p>
    <p>.</p>
    <p>.</p>
    <link rel="icon" href="icon.png">
</head>
<body>

    <input
        type="url"
        id="link"
        placeholder="Link eingeben..."
    >

    <button onclick="openLink()">Öffnen</button>

    <script>
        function openLink() {
            let link = document.getElementById("link").value.trim();

            if (!link) {
                alert("Bitte einen Link eingeben.");
                return;
            }

            if (!/^https?:\/\//i.test(link)) {
                link = "https://" + link;
            }

            window.location.href = link;
        }
    </script>

</body>
</html>
