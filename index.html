
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodnotes</title>

    <p> </p>
    <p> </p>
    <p> </p>
    <link rel="icon" href="https://cdn.prod.website-files.com/6978a92a56d24460cdf7442e/69ddf4810777de072d94b23f_68dff59f6dde021933bb00b3_Goodnotes-icon-256.png">
</head>
<body>

    <input
        type="url"
        id="link"
        placeholder="Link eingeben..."
    >

    <button onclick="openLink()">Öffnen</button>

    <script>
        function openLink() {
            let link = document.getElementById("link").value.trim();

            if (!link) {
                alert("Bitte einen Link eingeben.");
                return;
            }

            if (!/^https?:\/\//i.test(link)) {
                link = "https://" + link;
            }

            window.location.href = link;
        }
    </script>

</body>
</html>
